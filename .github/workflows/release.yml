name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Validate tag, manifest, and changelog
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.ref_name }}
          REQUESTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$REQUESTED_TAG
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi
          test "$REQUESTED_REF" = "refs/tags/$tag" || {
            echo 'manual release runs must be dispatched from the version tag' >&2
            exit 1
          }

          test "$(git cat-file -t "$tag")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          tag_object_sha=$(git rev-parse "$tag^{tag}")
          tag_verified=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            --jq '.verification.verified')
          test "$tag_verified" = true || {
            echo "release tag signature is not verified by GitHub" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$tag")" || {
            echo "checked-out commit does not match $tag" >&2
            exit 1
          }

          version=${tag#v}
          manifest_version=$(cargo +stable metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "crush-ssh") | .version')
          test "$manifest_version" = "$version" || {
            echo "Cargo version $manifest_version does not match tag $tag" >&2
            exit 1
          }
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no release section for $version" >&2
            exit 1
          }

          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools

      - name: Test release build
        run: cargo +stable test --release --locked --target "${{ matrix.target }}"

      - name: Build release binary
        run: cargo +stable build --release --locked --target "${{ matrix.target }}"

      - name: Enforce release binary size
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/crush"
          bytes=$(wc -c <"$binary" | tr -d '[:space:]')
          limit=$((5 * 1024 * 1024))
          if [ "$bytes" -gt "$limit" ]; then
            echo "$binary is $bytes bytes; limit is $limit" >&2
            exit 1
          fi

      - name: Verify static musl binary
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/crush"
          if readelf --program-headers "$binary" | grep -q ' INTERP '; then
            echo "$binary contains a dynamic interpreter" >&2
            exit 1
          fi

      - name: Package release archive
        run: |
          scripts/package-release.sh \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/crush" \
            dist

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crush-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false

  publish:
    name: Sign and publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: crush-*
          path: dist
          merge-multiple: true

      - name: Validate archive set and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print | sort)
          if [[ ${#archives[@]} -ne 6 ]]; then
            printf 'expected 6 release archives, found %s\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum -- *.tar.gz >SHA256SUMS
          )

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Create SPDX SBOM
        run: |
          syft scan dir:. \
            --exclude './target' \
            --output "spdx-json=dist/crush-${{ needs.validate.outputs.version }}.spdx.json"

      - name: Attest checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*.tar.gz dist/SHA256SUMS dist/*.spdx.json; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Crush $RELEASE_VERSION" \
            --generate-notes
