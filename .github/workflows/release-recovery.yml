name: Release recovery
run-name: Recover ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish
        required: true
        type: string
      source_run_id:
        description: Release run containing the completed platform archives
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-recovery-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    name: Validate recovery metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Validate tag and source run
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$RELEASE_TAG
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH: $tag" >&2
            exit 1
          fi
          if [[ ! $SOURCE_RUN_ID =~ ^[0-9]+$ ]]; then
            echo "source run ID must be numeric: $SOURCE_RUN_ID" >&2
            exit 1
          fi
          test "$(git cat-file -t "$tag")" = tag || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          tag_commit=$(git rev-list -n 1 "$tag")
          test "$(git rev-parse HEAD)" = "$tag_commit" || {
            echo "checked-out commit does not match $tag" >&2
            exit 1
          }

          version=${tag#v}
          manifest_version=$(cargo +stable metadata --no-deps --format-version 1 | \
            jq -r '.packages[] | select(.name == "crush-ssh") | .version')
          test "$manifest_version" = "$version" || {
            echo "Cargo version $manifest_version does not match tag $tag" >&2
            exit 1
          }
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "CHANGELOG.md has no release section for $version" >&2
            exit 1
          }

          source_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r .name <<<"$source_run")" = Release || {
            echo "$SOURCE_RUN_ID is not a Release workflow run" >&2
            exit 1
          }
          test "$(jq -r .head_sha <<<"$source_run")" = "$tag_commit" || {
            echo "$SOURCE_RUN_ID does not belong to $tag" >&2
            exit 1
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing recovery" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  build-apple-arm:
    name: Cross-build aarch64-apple-darwin
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Test release source natively
        run: cargo +stable test --release --locked

      - name: Cross-build release binary
        run: cargo +stable build --release --locked --target aarch64-apple-darwin

      - name: Verify and package release archive
        shell: bash
        run: |
          set -euo pipefail
          binary=target/aarch64-apple-darwin/release/crush
          file "$binary" | grep -q 'arm64' || {
            echo "$binary is not an Apple arm64 executable" >&2
            exit 1
          }
          scripts/package-release.sh \
            "${{ needs.validate.outputs.version }}" \
            aarch64-apple-darwin \
            "$binary" \
            dist

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crush-aarch64-apple-darwin
          path: dist/*.tar.gz
          if-no-files-found: error
          archive: false

  publish:
    name: Sign and publish recovered release
    needs: [validate, build-apple-arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download completed platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: crush-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download recovered Apple ARM archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: crush-*
          path: dist
          merge-multiple: true

      - name: Validate archive set and create checksums
        run: scripts/prepare-release-assets.sh "${{ needs.validate.outputs.version }}" dist

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Create SPDX SBOM
        run: |
          syft scan dir:. \
            --exclude './target' \
            --output "spdx-json=dist/crush-${{ needs.validate.outputs.version }}.spdx.json"

      - name: Attest checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            dist/crush-installer.ps1 \
            dist/crush-installer.sh \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/*.spdx.json; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Crush $RELEASE_VERSION" \
            --generate-notes
