[package]
name = "crush-ssh"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Crisp Remote Uninterrupted Shell: an SSH-bootstrapped mobile terminal"
license = "MIT"
repository = "https://github.com/copperlaneai/crush"
publish = false

[[bin]]
name = "crush"
path = "src/main.rs"

[[bench]]
name = "passthrough"
harness = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
libc = "0.2.177"
lz4_flex = { version = "0.11.5", default-features = false, features = ["std"] }
rustix-openpty = "=0.2.0"
signal-hook = "0.4.3"
zeroize = "1.8.2"

[dev-dependencies]
proptest = "1.9.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
